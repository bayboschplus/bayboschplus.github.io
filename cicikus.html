<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cicikus 2.5</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #222;
            font-family: 'Press Start 2P', monospace;
        }
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 480px;
            margin: 0 auto;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #70c5ce;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        #pause-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 45px;
            height: 45px;
            background: #f39c12;
            border: 3px solid #fff;
            border-radius: 8px;
            color: white;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            cursor: pointer;
            box-shadow: 0 4px 0 #d35400;
        }
        #pause-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #d35400;
        }
        #game-over-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #ded895;
            border: 4px solid #554320;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            color: #554320;
            display: none;
            pointer-events: auto;
            width: 80%;
            max-width: 300px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        }
        .score-val {
            font-size: 20px;
            color: #fff;
            text-shadow: 2px 2px 0 #000;
            margin: 8px 0 15px 0;
        }
        #restart-btn {
            width: 100%;
            padding: 12px;
            background: #f1c40f;
            border: 3px solid #b7950b;
            color: #fff;
            font-family: inherit;
            font-size: 12px;
            text-shadow: 1px 1px 0 #000;
            cursor: pointer;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <div id="ui-layer">
            <div id="pause-btn">❚❚</div>
            
            <div id="game-over-screen">
                <div style="font-size: 14px; margin-bottom: 15px;">OYUN BİTTİ</div>
                <div style="font-size: 10px;">SKOR</div>
                <div id="final-score" class="score-val">0</div>
                <div style="font-size: 10px;">EN İYİ</div>
                <div id="best-score" class="score-val">0</div>
                <button id="restart-btn">TEKRAR OYNA</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const pauseBtn = document.getElementById("pause-btn");
        const gameOverScreen = document.getElementById("game-over-screen");
        const finalScoreEl = document.getElementById("final-score");
        const bestScoreEl = document.getElementById("best-score");
        const restartBtn = document.getElementById("restart-btn");

        // Canvas Boyutlandırma
        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        resizeCanvas();
        window.addEventListener("resize", resizeCanvas);

        // Oyun Durum Değişkenleri
        let isPaused = false;
        let isGameOver = false;
        let score = 0;
        let frameCount = 0;

        // Kuş Nesnesi
        const bird = {
            x: 60,
            y: canvas.height / 2,
            radius: 14,
            velocity: 0,
            gravity: 0.35,
            jumpPower: -7,
            rotation: 0,
            
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                
                // Açı hesaplama
                this.rotation = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, this.velocity * 0.08));
                ctx.rotate(this.rotation);

                // Kuş Gövdesi
                ctx.fillStyle = "#f8e71c";
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = "#000";
                ctx.stroke();

                // Göz
                ctx.fillStyle = "#fff";
                ctx.beginPath();
                ctx.arc(6, -4, 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = "#000";
                ctx.beginPath();
                ctx.arc(8, -4, 2, 0, Math.PI * 2);
                ctx.fill();

                // Gaka
                ctx.fillStyle = "#e67e22";
                ctx.beginPath();
                ctx.moveTo(8, 2);
                ctx.lineTo(18, 5);
                ctx.lineTo(8, 8);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                ctx.restore();
            },
            
            update() {
                this.velocity += this.gravity;
                this.y += this.velocity;

                // Tavan ve taban sınırları
                if (this.y - this.radius < 0) {
                    this.y = this.radius;
                    this.velocity = 0;
                }
                if (this.y + this.radius > canvas.height - 40) { // Zemin seviyesi
                    endGame();
                }
            },
            
            jump() {
                if (!isPaused && !isGameOver) {
                    this.velocity = this.jumpPower;
                }
            },

            reset() {
                this.y = canvas.height / 2;
                this.velocity = 0;
            }
        };

        // Boru Yönetimi
        const pipes = [];
        const pipeWidth = 55;
        const pipeGap = 130;

        function spawnPipe() {
            const minHeight = 40;
            const maxHeight = canvas.height - 40 - pipeGap - minHeight;
            const topHeight = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;

            pipes.push({
                x: canvas.width,
                topHeight: topHeight,
                bottomY: topHeight + pipeGap,
                passed: false
            });
        }

        function updatePipes() {
            if (frameCount % 100 === 0) {
                spawnPipe();
            }

            for (let i = pipes.length - 1; i >= 0; i--) {
                let p = pipes[i];
                p.x -= 2.5; // Boru hızı

                // Çarpışma Kontrolü
                if (
                    bird.x + bird.radius > p.x &&
                    bird.x - bird.radius < p.x + pipeWidth &&
                    (bird.y - bird.radius < p.topHeight || bird.y + bird.radius > p.bottomY)
                ) {
                    endGame();
                }

                // Skor Kazanma
                if (!p.passed && p.x + pipeWidth < bird.x) {
                    p.passed = true;
                    score++;
                }

                // Ekrandan çıkan boruyu bellekten sil
                if (p.x + pipeWidth < 0) {
                    pipes.splice(i, 1);
                }
            }
        }

        function drawPipes() {
            ctx.fillStyle = "#73bf2e";
            ctx.strokeStyle = "#2d4312";
            ctx.lineWidth = 3;

            pipes.forEach(p => {
                // Üst Boru
                ctx.fillRect(p.x, 0, pipeWidth, p.topHeight);
                ctx.strokeRect(p.x, 0, pipeWidth, p.topHeight);

                // Alt Boru
                const bottomHeight = canvas.height - 40 - p.bottomY;
                ctx.fillRect(p.x, p.bottomY, pipeWidth, bottomHeight);
                ctx.strokeRect(p.x, p.bottomY, pipeWidth, bottomHeight);
            });
        }

        // Zemin ve Arka Plan
        function drawEnvironment() {
            // Zemin
            ctx.fillStyle = "#ded895";
            ctx.fillRect(0, canvas.height - 40, canvas.width, 40);
            ctx.strokeStyle = "#554320";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, canvas.height - 40);
            ctx.lineTo(canvas.width, canvas.height - 40);
            ctx.stroke();

            // Skor Göstergesi
            if (!isGameOver) {
                ctx.fillStyle = "#fff";
                ctx.strokeStyle = "#000";
                ctx.lineWidth = 4;
                ctx.font = "28px 'Press Start 2P'";
                ctx.textAlign = "center";
                ctx.strokeText(score, canvas.width / 2, 60);
                ctx.fillText(score, canvas.width / 2, 60);
            }
        }

        // Ana Oyun Döngüsü (Akıcı 60 FPS)
        function loop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (!isPaused && !isGameOver) {
                bird.update();
                updatePipes();
                frameCount++;
            }

            drawPipes();
            drawEnvironment();
            bird.draw();

            requestAnimationFrame(loop);
        }

        // Kontroller
        function togglePause() {
            if (isGameOver) return;
            isPaused = !isPaused;
            pauseBtn.innerText = isPaused ? "▶" : "❚❚";
        }

        function endGame() {
            isGameOver = true;
            let best = localStorage.getItem("flappy_best") || 0;
            if (score > best) {
                best = score;
                localStorage.setItem("flappy_best", best);
            }
            finalScoreEl.innerText = score;
            bestScoreEl.innerText = best;
            gameOverScreen.style.display = "block";
        }

        function resetGame() {
            bird.reset();
            pipes.length = 0;
            score = 0;
            frameCount = 0;
            isGameOver = false;
            isPaused = false;
            pauseBtn.innerText = "❚❚";
            gameOverScreen.style.display = "none";
        }

        // Dokunma / Tıklama Dinleyicileri
        canvas.addEventListener("touchstart", (e) => {
            e.preventDefault();
            bird.jump();
        });

        canvas.addEventListener("mousedown", (e) => {
            bird.jump();
        });

        pauseBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            togglePause();
        });

        restartBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            resetGame();
        });

        // Oyunu Başlat
        requestAnimationFrame(loop);
    </script>
</body>
</html>
